stages: [verify, reverse-engineer]

verify-ciel-recovery:
  image: node:22-alpine
  stage: verify
  script:
    - npm install --ignore-scripts
    - node --check scripts/reassemble-recovered-worker.mjs
    - node --check scripts/apply-paper-tier-fix.mjs
    - node --check scripts/apply-core-scalp-fix.mjs
    - node --check scripts/apply-leverup-integration.mjs
    - node --check scripts/test-core-scalp.mjs
    - node --check scripts/test-leverup-advisor.mjs
    - node --check scripts/test-paper-tier-fix.mjs
    - node --check scripts/test-leverup-1ct.mjs
    - node --check src/leverup-1ct.js
    - node --check src/leverup-readonly.js
    - node --check src/leverup-advisor.js
    - node --check scripts/test-leverup-readonly.mjs
    - node --check scripts/check-staging-config.mjs
    - node --check scripts/summarize-rea.mjs
    - node --check scripts/verify-leverup-market-tiers.mjs
    - node --check scripts/smoke-live-worker.mjs
    - npm run check
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'

verify-leverup-market-metadata:
  image: node:22-alpine
  stage: verify
  needs: [verify-ciel-recovery]
  script:
    - npm install --ignore-scripts
    - npm run check:paper
    - node scripts/verify-leverup-market-tiers.mjs
  artifacts:
    when: always
    paths: [leverup-market-tier-audit.json]
    expire_in: 30 days
  allow_failure: true
  rules:
    - changes:
        - scripts/verify-leverup-market-tiers.mjs
        - recovered-src/symbols.js.part-001
        - wrangler.jsonc

analyze-ciel-with-rea:
  image: node:22-alpine
  stage: reverse-engineer
  needs: [verify-ciel-recovery]
  script:
    - npm install --ignore-scripts
    - apk add --no-cache procps
    - npm run check:paper
    - mkdir -p "$CI_PROJECT_DIR/rea-patched"
    - cp reconstructed/patched-worker.js "$CI_PROJECT_DIR/rea-patched/worker.js"
    - npx -y rea-agents@latest analyze-javascript-application "$CI_PROJECT_DIR/rea-patched" --json > "$CI_PROJECT_DIR/rea-patched-analysis.json" 2> "$CI_PROJECT_DIR/rea-patched-analysis.stderr.log"
    - node scripts/summarize-rea.mjs "$CI_PROJECT_DIR/rea-patched-analysis.json" "$CI_PROJECT_DIR/rea-patched-summary.json"
  artifacts:
    when: always
    paths: [rea-patched-analysis.json, rea-patched-summary.json, rea-patched-analysis.stderr.log]
    expire_in: 30 days
  allow_failure: false
  rules:
    - changes:
        - recovered-src/**/*
        - scripts/**/*
        - src/**/*
        - package.json
        - wrangler.jsonc
        - .gitlab-ci.yml

staging-readonly-smoke:
  image: node:22-alpine
  stage: verify
  needs: []
  script:
    - node scripts/smoke-live-worker.mjs
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "audit/paper-trading-fix" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

verify-cloudflare-bun-bootstrap:
  image: node:22-alpine
  stage: verify
  script:
    - npm install --global bun@1.4.4
    - test "$(bun --version)" = "1.4.4"
    - bun install
    - test -s reconstructed/patched-worker.js
    - node --check reconstructed/patched-worker.js
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'

build-cloudflare-release-candidate:
  image: node:22-alpine
  stage: verify
  needs: [verify-ciel-recovery]
  script:
    - npm install --ignore-scripts
    - npm run build
    - npx wrangler deploy --dry-run --outdir dist --config wrangler.jsonc
    - node --input-type=module -e 'import fs from "node:fs"; const files=fs.readdirSync("dist").filter((f)=>f.endsWith(".js")); if(files.length!==1) throw new Error("Expected exactly one bundled Worker JS file in dist, found "+files.join(",")); const file="dist/"+files[0]; const data=fs.readFileSync(file); const b64=data.toString("base64"); console.log("WORKER_BUNDLE_FILE="+file+" BYTES="+data.length); for(let i=0,n=0;i<b64.length;i+=3000,n++) console.log("WORKER_BUNDLE_CHUNK_"+n+":"+b64.slice(i,i+3000)); console.log("WORKER_BUNDLE_CHUNK_COUNT="+Math.ceil(b64.length/3000));'
  artifacts:
    when: always
    paths: [dist/, reconstructed/patched-worker.js]
    expire_in: 1 day
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/leverup-1ct-autotrader" || $CI_COMMIT_BRANCH == "integration/leverup-1ct-main"'
